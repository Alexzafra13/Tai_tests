# Start with:  docker compose up -d   then open http://<server>:9080
# Update with: docker compose pull && docker compose up -d
#
# Nothing to configure: on first start the app asks you to create the
# administrator, HTTPS behind a proxy and each user's time zone are detected
# on their own, and everything else is set from the app.
services:
  tai:
    image: ghcr.io/alexzafra13/tai_tests:latest
    container_name: tai
    restart: unless-stopped
    ports:
      # The app listens on 8080 inside the container; 9080 is the server's
      # port. To use another one change the first number, e.g. "9000:8080".
      - "9080:8080"
    volumes:
      - tai-data:/data

volumes:
  tai-data:
